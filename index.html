<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0c" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Герои Асханы</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260829-1" />
    <link rel="stylesheet" href="paper-throne.css?v=20260804-1" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">ГА</div>
          <div>
            <p class="eyebrow">Pathfinder 1e</p>
            <h1>Герои Асханы</h1>
          </div>
        </div>
        <button id="sidebarToggle" class="sidebar-toggle" type="button" title="Свернуть меню" aria-label="Свернуть меню">
          <span class="sidebar-toggle-icon">‹</span>
        </button>

        <nav class="nav" aria-label="Разделы">
          <button class="nav-item active" data-view="dashboard">Обзор</button>
          <button class="nav-item" data-view="wiki">Wiki</button>
          <button class="nav-item" data-view="map">Карта</button>
          <button class="nav-item" data-view="directory">NPC / Фракции</button>
          <button class="nav-item" data-view="settlements">Поселения</button>
          <button class="nav-item" data-view="countries">Государства</button>
          <button class="nav-item" data-view="items">Предметы</button>
          <button class="nav-item" data-view="calendar">Календарь</button>
          <button class="nav-item" data-view="sessions">Журнал</button>
          <button class="nav-item" data-view="characters">Персонажи</button>
          <button class="nav-item" data-view="gallery">Галерея</button>
          <button class="nav-item" data-view="quests">Задания</button>
          <button class="nav-item" data-view="roller">Roll</button>
          <button class="nav-item" data-view="ashana-games">Игры Асханы</button>
          <button class="nav-item" data-view="minigame">Мини-игры</button>
          <button class="nav-item" data-view="admin">Админ</button>
        </nav>

        <div class="sidebar-footer">
          <span id="adminBadge" class="status-pill">режим игрока</span>
          <button id="quickLoginButton" class="ghost-button">Войти</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input id="globalSearch" type="search" placeholder="Поиск по Асхане" />
          </div>
          <div class="topbar-actions">
            <select id="activeCharacterSelect" aria-label="Активный персонаж"></select>
            <button id="quickRollButton" class="icon-button quick-roll-trigger" type="button" title="Быстрый Roll" aria-label="Открыть быстрый Roll" aria-expanded="false">d20</button>
            <button id="resetViewButton" class="icon-button" title="На обзор">⌂</button>
          </div>
        </header>

        <section id="viewRoot" class="view-root" aria-live="polite"></section>
      </main>
    </div>

    <aside id="quickRollPanel" class="quick-roll-panel" aria-label="Быстрый Roll" hidden></aside>

    <dialog id="loginDialog" class="dialog">
      <form method="dialog" class="dialog-panel" id="loginForm">
        <div>
          <p class="eyebrow">Редактирование Асханы</p>
          <h2>Вход мастера</h2>
        </div>
        <label>
          Email
          <input id="loginEmail" type="email" autocomplete="username" />
        </label>
        <label>
          Пароль
          <input id="adminPassword" type="password" autocomplete="current-password" />
        </label>
        <p id="loginError" class="form-error" hidden>Не удалось войти</p>
        <div class="dialog-actions">
          <button value="cancel" class="ghost-button" type="button" id="cancelLogin">Отмена</button>
          <button value="default" class="primary-button" type="submit">Войти</button>
        </div>
      </form>
    </dialog>

    <script src="vendor/supabase.min.js"></script>
    <script src="vendor/three.min.js"></script>
    <script src="paper-throne.js?v=20260804-1" charset="UTF-8"></script>
    <script src="pf1-races.js?v=20260814-1" charset="UTF-8"></script>
    <script src="pf1-ogres.js?v=20260814-1" charset="UTF-8"></script>
    <script src="pf1-harpies.js?v=20260814-1" charset="UTF-8"></script>
    <script>window.ASHANA_SUPABASE_URL = "https://ashana-russia.netlify.app/sb";</script>
    <script src="mirror-media.js?v=20260917-1"></script>
    <script src="app.js?v=20260917-2" charset="UTF-8"></script>
  </body>
</html>
